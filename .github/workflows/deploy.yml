name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /dashboard-frontend/
          # The shared password has been replaced by signing in with an IATI
          # Account; see useAccess. The accounts that see every organisation
          # default to the list in nuxt.config.ts and can be overridden here
          # with NUXT_PUBLIC_ALL_ORGS_EMAILS. Note that a NUXT_PUBLIC_* value is
          # inlined into the published bundle, so it cannot hold a secret.
          #
          # Register Your Data allows different origins on its two instances.
          # iati.github.io is allowed by dev only — production refuses its CORS
          # preflight — so this build has to use dev, while the config default
          # stays on production for every other deployment (and
          # preview-dashboard.iatistandard.org, which both instances allow).
          # Once iati.github.io is registered against production, delete this
          # line and the default takes over.
          NUXT_PUBLIC_RYD_BASE: https://dev.api.registeryourdata.iatistandard.org
          #
          # Uncomment to put the "Development version" notice back across the
          # top of every page.
          # NUXT_PUBLIC_SHOW_DEV_BANNER: 'true'

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
